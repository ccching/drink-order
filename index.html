<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NetAI </title>
    <link rel="stylesheet" href="styles.css?v=20260521-2" />
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">Natural First Tea Espresso</p>
        <h1 id="pageTitle">NetAI 碩二進度報告</h1>
        <h4 id="storeSubtitle">飲料是 93°C 鮮自然！一人補助 $40</h4>
        <h4>請正常點餐，不要爆破網站：）</h4>
      </div>
      <div class="header-summary" aria-live="polite">
        <span id="cartCount">0 杯</span>
        <strong id="cartTotal">$0</strong>
      </div>
    </header>

    <main class="app-shell">
      <section class="menu-pane" aria-labelledby="menuTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Step 1</p>
            <div class="menu-title-row">
              <h2 id="menuTitle">選擇飲料</h2>
              <span id="activeStoreBadge" class="store-badge">93°C 鮮自然</span>
            </div>
          </div>
          <label class="search-box">
            <span>搜尋</span>
            <input id="searchInput" type="search" placeholder="輸入飲品或口味" autocomplete="off" />
          </label>
        </div>

        <div id="categoryTabs" class="category-tabs" role="tablist" aria-label="飲料分類"></div>
        <div id="drinkGrid" class="drink-grid" aria-live="polite"></div>
      </section>

      <aside class="order-pane" aria-labelledby="orderTitle">
        <form id="orderForm" class="order-form">
          <div class="section-heading compact">
            <div>
              <p class="eyebrow">Step 2</p>
              <h2 id="orderTitle">客製化</h2>
            </div>
            <button class="ghost-button" type="button" id="clearSelectionButton">清空</button>
          </div>

          <div class="selected-drink" id="selectedDrink">
            <span>尚未選擇飲料</span>
          </div>

          <fieldset class="control-group" id="sizeGroup">
            <legend>容量</legend>
            <div class="segmented" id="sizeOptions"></div>
          </fieldset>

          <fieldset class="control-group" id="temperatureGroup">
            <legend>溫度</legend>
            <div class="segmented" id="temperatureOptions"></div>
          </fieldset>

          <fieldset class="control-group" id="sugarGroup">
            <legend>甜度</legend>
            <div class="segmented wrap" id="sugarOptions"></div>
          </fieldset>

          <fieldset class="control-group" id="iceGroup">
            <legend>冰塊</legend>
            <div class="segmented wrap" id="iceOptions"></div>
          </fieldset>

          <fieldset class="control-group">
            <legend>加料</legend>
            <div id="toppingOptions" class="topping-list"></div>
            <p class="hint" id="toppingHint">加料與濃度加強依菜單價格計算。</p>
          </fieldset>

          <div class="quantity-row">
            <label for="quantityInput">數量</label>
            <div class="stepper">
              <button type="button" id="decreaseQty" aria-label="減少數量">−</button>
              <input id="quantityInput" type="number" min="1" max="99" value="1" inputmode="numeric" />
              <button type="button" id="increaseQty" aria-label="增加數量">+</button>
            </div>
          </div>

          <label class="field">
            <span>備註</span>
            <textarea id="itemNote" rows="2" placeholder="例如：分開裝、不要珍珠"></textarea>
          </label>

          <div class="price-panel" aria-live="polite">
            <span>小計</span>
            <strong id="currentPrice">$0</strong>
          </div>

          <button class="primary-button" type="button" id="addToCartButton">加入訂單</button>
        </form>

        <section class="cart-panel" aria-labelledby="cartTitle">
          <div class="section-heading compact">
            <div>
              <p class="eyebrow">Step 3</p>
              <h2 id="cartTitle">訂單</h2>
            </div>
            <button class="ghost-button" type="button" id="clearCartButton">清空</button>
          </div>
          <div id="cartItems" class="cart-items"></div>
          <div class="cart-total">
            <span>總計</span>
            <strong id="grandTotal">$0</strong>
          </div>
          <button class="primary-button checkout-button" type="button" id="checkoutButton" disabled>
            下一步：投票三明治口味
          </button>
        </section>

        <section class="pizza-panel" aria-labelledby="pizzaVoteTitle">
          <div class="section-heading compact">
            <div>
              <p class="eyebrow">Step 4</p>
              <h2 id="pizzaVoteTitle">投票三明治口味</h2>
            </div>
            <span class="vote-count" id="pizzaVoteCount">0 / 1 票</span>
          </div>
          <p class="hint" id="pollDescription">一人只能選一個。送出飲料前必須先投票。</p>
          <div id="pizzaVoteOptions" class="pizza-vote-list" aria-live="polite"></div>
          <p id="pizzaVoteHint" class="submit-status" role="status"></p>
        </section>

        <form id="customerForm" class="submit-panel">
          <div class="section-heading compact">
            <div>
              <p class="eyebrow">Step 5</p>
              <h2>送出訂單</h2>
            </div>
          </div>
          <label class="field">
            <span>姓名 <strong class="required-mark">必填</strong></span>
            <input id="customerName" type="text" placeholder="姓名" autocomplete="name" required />
          </label>
          <label class="field">
            <span>整筆備註</span>
            <textarea id="orderNote" rows="2" placeholder=""></textarea>
          </label>
          <button class="primary-button" type="submit" id="submitOrderButton">送出</button>
          <p id="submitStatus" class="submit-status" role="status"></p>
        </form>
      </aside>
    </main>

    <script src="config.js?v=20260521-6"></script>
    <script src="app.js?v=20260521-6"></script>
  </body>
</html>
